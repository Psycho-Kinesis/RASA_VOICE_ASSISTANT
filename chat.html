<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rachel · BYD Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f1720;
    --panel: #17212c;
    --bubble-bot: #1f2e3a;
    --bubble-user: #0a7d6f;
    --accent: #14b8a6;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --danger: #e5534b;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #16222c 0%, var(--bg) 60%);
    color: var(--text);
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }
  header {
    padding: 20px 4px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #22303c;
  }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #0a7d6f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    color: #04201c;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header .subtitle {
    font-size: 12.5px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .status-dot.online { background: #3ddc97; box-shadow: 0 0 6px #3ddc97; }
  .status-dot.offline { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: rise 0.18s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: #eafff9;
    border-bottom-right-radius: 4px;
  }
  .row.system .bubble {
    background: transparent;
    color: var(--text-dim);
    font-size: 12.5px;
    text-align: center;
    max-width: 100%;
    padding: 4px 8px;
  }
  .row.system { justify-content: center; }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 14px 4px 18px;
    border-top: 1px solid #22303c;
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid #263341;
    color: var(--text);
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--text-dim); }
  #input:disabled { opacity: 0.5; }

  button#send {
    background: var(--accent);
    color: #04201c;
    border: none;
    border-radius: 999px;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  button#send:hover:not(:disabled) { transform: scale(1.05); }
  button#send:active:not(:disabled) { transform: scale(0.95); }
  button#send:disabled { opacity: 0.4; cursor: not-allowed; }
  button#send svg { width: 18px; height: 18px; }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: #263341; border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">R</div>
    <div>
      <h1>Rachel · BYD Assistant</h1>
      <div class="subtitle">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Checking connection…</span>
      </div>
    </div>
  </header>

  <div id="messages"></div>

  <form id="composer" autocomplete="off">
    <input id="input" type="text" placeholder="Ask about a BYD model…" maxlength="500" />
    <button id="send" type="submit" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>
</div>

<script>
(function () {
  "use strict";

  // Point this at your Rasa server if it isn't on the default host/port.
  var RASA_URL = "http://localhost:5005/webhooks/rest/webhook";
  var HEALTH_URL = "http://localhost:5005/version";

  // One id per page load - matches the "sender" the REST webhook expects.
  var senderId = "web-" + Math.random().toString(36).slice(2, 10);

  var messagesEl = document.getElementById("messages");
  var form = document.getElementById("composer");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBubble(role, text) {
    var row = document.createElement("div");
    row.className = "row " + role;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addSystem(text) {
    return addBubble("system", text);
  }

  function addTypingIndicator() {
    var row = document.createElement("div");
    row.className = "row bot";
    row.id = "typingRow";
    var bubble = document.createElement("div");
    bubble.className = "bubble typing";
    bubble.innerHTML = "<span></span><span></span><span></span>";
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    var row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  function setOnline(online) {
    statusDot.className = "status-dot " + (online ? "online" : "offline");
    statusText.textContent = online
      ? "Connected"
      : "Rasa server unreachable at localhost:5005";
    input.disabled = !online;
    sendBtn.disabled = !online || input.value.trim() === "";
  }

  function checkHealth() {
    fetch(HEALTH_URL, { method: "GET" })
      .then(function (r) { setOnline(r.ok); })
      .catch(function () { setOnline(false); });
  }

  function sendMessage(text) {
    addBubble("user", text);
    addTypingIndicator();
    sendBtn.disabled = true;
    input.disabled = true;

    fetch(RASA_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sender: senderId, message: text }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (replies) {
        removeTypingIndicator();
        if (!Array.isArray(replies) || replies.length === 0) {
          addSystem("(no reply - is the action server running?)");
        } else {
          replies.forEach(function (r) {
            if (r.text) addBubble("bot", r.text);
          });
        }
      })
      .catch(function (err) {
        removeTypingIndicator();
        addSystem("Could not reach the Rasa server (" + err.message + ")");
        setOnline(false);
      })
      .finally(function () {
        input.disabled = false;
        input.focus();
        sendBtn.disabled = input.value.trim() === "";
      });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;
    sendMessage(text);
  });

  input.addEventListener("input", function () {
    sendBtn.disabled = input.disabled || input.value.trim() === "";
  });

  addSystem("Say hello to get started.");
  checkHealth();
  input.focus();
})();
</script>
</body>
</html>
